<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobile Security Alert</title>
  <style>
    :root { --ink:#1f2933; --muted:#5b6675; --line:#d6dde6; --panel:#ffffff; --bg:#eef3f7; --accent:#235a87; --warn:#8a4b12; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial,Helvetica,sans-serif; background:var(--bg); color:var(--ink); line-height:1.5; }
    header { background:#173f5f; color:white; padding:28px 32px; border-bottom:4px solid #f2b84b; }
    header h1 { margin:0; font-size:30px; letter-spacing:0; }
    header p { margin:6px 0 0; color:#dceaf4; }
    main { max-width:980px; margin:28px auto; padding:0 24px 42px; }
    section { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:18px 20px; margin:0 0 16px; }
    h2 { margin:0 0 8px; font-size:20px; color:#173f5f; }
    p { margin:0; }
    code { background:#eef2f6; border:1px solid #d9e1ea; border-radius:4px; padding:2px 5px; }
    .marker { color:var(--warn); font-weight:700; }
    footer { text-align:center; color:var(--muted); padding:20px; font-size:13px; }
  </style>
</head>
<body>
  <header><h1>Mobile Security Alert</h1><p>Harborview Expo evidence artifact</p></header>
  <main><section><h2>Scareware</h2><p>The page claims the device is infected and pushes <code>Harbor Shield Cleaner</code>.</p></section>
<section><h2>Social Cue</h2><p>The warning repeats countdown language and the marker <code>BL-LANTERN-9</code>.</p></section></main>
  <footer>Training artifact | Do not submit personal information</footer>
  <script src="../../cq-bridge.js"></script>
</body>
</html>
